image: golang:1.25

stages:
  - test

variables:
  RDB30_VERSION: 3.0.22
  RDB50_VERSION: 5.0.8
  RDB51_VERSION: 5.1.4
  RDB60_VERSION: 6.0.0-SNAPSHOT.1274
  PGX_TEST_DATABASE: database=employee host=localhost port=3050 user=sysdba password=masterkey
  PGX_TEST_TCP_CONN_STRING: database=employee host=localhost port=3050 user=sysdba password=masterkey

.go-cache:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    - mkdir -p .go
  cache:
    when: always
    paths:
      - .go/pkg/mod/

format:
  stage: test
  tags: [docker, linux, x86_64]
  extends: .go-cache
  script:
    - go fmt $(go list ./... | grep -v /vendor/)
    - go vet $(go list ./... | grep -v /vendor/)

test:
  stage: test
  tags: [docker, linux, x86_64]
  extends: .go-cache
  before_script:
    - wget -q ${RDB_DOWNLOAD_URL} -O installer
    - chmod +x ./installer
    - ./installer --mode unattended --sysdba_password masterkey
    - cp ci/firebird.conf /opt/RedDatabase
    - g++ -o libfbxci.so -shared -fPIC ci/udrs.cpp -I_tools/msgs/include
    - cp libfbxci.so /opt/RedDatabase/plugins/udr
    - |
      if [ -e /etc/init.d/reddatabase ]; then
        /etc/init.d/reddatabase start
      else
        /etc/init.d/firebird start
      fi
  script:
    - go run gotest.tools/gotestsum@latest $(go list ./... | grep -v /vendor/) -coverprofile cover.out
  after_script:
    - go tool cover -html cover.out -o cover.html
    - go tool cover -func cover.out
  artifacts:
    when: always
    paths:
      - cover.html
  coverage: '/total:\s+\(statements\)\s+\d+.\d+%/'
  parallel:
    matrix:
      - RDB_VERSION: "3.0"
        RDB_DOWNLOAD_URL: "http://builds.red-soft.biz/release_hub/rdb30/${RDB30_VERSION}/download/red-database:linux-x86_64-enterprise:${RDB30_VERSION}:bin"
      - RDB_VERSION: "5.0"
        RDB_DOWNLOAD_URL: "http://builds.red-soft.biz/release_hub/rdb50/${RDB50_VERSION}/download/red-database:linux-x86_64-enterprise:${RDB50_VERSION}:bin"
      - RDB_VERSION: "5.1"
        RDB_DOWNLOAD_URL: "http://builds.red-soft.biz/release_hub/rdb50/${RDB51_VERSION}/download/red-database:linux-x86_64-enterprise:${RDB51_VERSION}:bin"
      - RDB_VERSION: "6.0"
        RDB_DOWNLOAD_URL: "http://builds.red-soft.biz/release_hub/rdb60/${RDB60_VERSION}/download/red-database:linux-x86_64-enterprise:${RDB60_VERSION}:bin"
