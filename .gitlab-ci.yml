image: golang:1.25

stages:
  - test

variables:
  RDB30_VERSION: 3.0.22
  RDB51_VERSION: 5.1.4
  RDB52_VERSION: 5.2.1
  RDB60_VERSION: 6.0.0-SNAPSHOT.1623
  FB30_VERSION: 3.0.13.33818-0
  FB40_VERSION: 4.0.6.3221-0
  FB50_VERSION: 5.0.3.1683-0
  FBX_TEST_DATABASE: database=employee host=localhost port=3050 user=sysdba password=masterkey
  GOLANGCI_LINT_VERSION: v2.12.2

.go-cache:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    - mkdir -p .go
  cache:
    when: always
    paths:
      - .go/pkg/mod/

format:
  stage: test
  tags: [docker, linux, x86_64]
  extends: .go-cache
  script:
    - go fmt $(go list ./... | grep -v /vendor/)
    - go vet $(go list ./... | grep -v /vendor/)

.test_template:
  stage: test
  tags: [docker, linux, x86_64]
  extends: .go-cache
  script:
    - COVERDIR=$(pwd)/reports/${REPORT}
    - PACKAGES=$(go list ./... 2> /dev/null | grep -v /vendor/|xargs|tr ' ' ",")
    - mkdir -p ${COVERDIR}
    - go run gotest.tools/gotestsum@latest --format testname -- -p 1 ${GOTEST_EXTRA_ARGS} -cover ./... -coverpkg=${PACKAGES} -test.gocoverdir=${COVERDIR}
  artifacts:
    when: always
    paths:
      - reports

.minio_template:
  tags: [docker, linux, x86_64]
  stage: test
  image:
    name: registry.red-soft.biz:5000/docker-images/3rdparty/minio/mc:RELEASE.2023-10-14T01-57-03Z
    entrypoint: ['']
  before_script:
    - mc alias set minio ${MINIO_SERVER} ${MINIO_USER} ${MINIO_PASSWORD}

test:rdb:
  extends: .test_template
  variables:
    REPORT: reddatabase_${RDB_VERSION}
  before_script:
    - wget -q ${RDB_DOWNLOAD_URL} -O installer
    - chmod +x ./installer
    - ./installer --mode unattended --sysdba_password masterkey
    - cp ci/firebird.conf ci/fbtrace.conf /opt/RedDatabase
    - g++ -o libfbxci.so -shared -fPIC ci/udrs.cpp -I_tools/msgs/include
    - cp libfbxci.so /opt/RedDatabase/plugins/udr
    - |
      if [ -e /etc/init.d/reddatabase ]; then
        /etc/init.d/reddatabase start
      else
        /etc/init.d/firebird start
      fi
  parallel:
    matrix:
      - RDB_VERSION: "${RDB30_VERSION}"
        RDB_DOWNLOAD_URL: "http://builds.red-soft.biz/release_hub/rdb30/${RDB30_VERSION}/download/red-database:linux-x86_64-enterprise:${RDB30_VERSION}:bin"
      - RDB_VERSION: "${RDB51_VERSION}"
        RDB_DOWNLOAD_URL: "http://builds.red-soft.biz/release_hub/rdb50/${RDB51_VERSION}/download/red-database:linux-x86_64-enterprise:${RDB51_VERSION}:bin"
      - RDB_VERSION: "${RDB52_VERSION}"
        RDB_DOWNLOAD_URL: "http://builds.red-soft.biz/release_hub/rdb50/${RDB52_VERSION}/download/red-database:linux-x86_64-enterprise:${RDB52_VERSION}:bin"
      - RDB_VERSION: "6.0"
        RDB_DOWNLOAD_URL: "http://builds.red-soft.biz/release_hub/rdb60/${RDB60_VERSION}/download/red-database:linux-x86_64-enterprise:${RDB60_VERSION}:bin"

test:fb:
  extends: .test_template
  variables:
      FB_DOWNLOAD_URL: "http://minio.red-soft.biz/3rdparty/firebird/Firebird-${FB_VERSION}-linux-x64.tar.gz"
      REPORT: firebird_${FB_VERSION}
  before_script:
    - sed -i 's|http://deb.debian.org|https://mirror.yandex.ru|g; s|http://security.debian.org|https://mirror.yandex.ru|g; s|deb.debian.org|mirror.yandex.ru|g; s|security.debian.org|mirror.yandex.ru|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
    - apt update && apt install -y libtommath1 libicu76
    - ln -s /usr/lib/x86_64-linux-gnu/libtommath.so.1 /usr/lib/x86_64-linux-gnu/libtommath.so.0
    - ln -s /usr/lib/x86_64-linux-gnu/libncursesw.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
    - wget -q ${FB_DOWNLOAD_URL} -O fb.tar.gz
    - tar xf fb.tar.gz
    - cd Firebird-${FB_VERSION}*
    - ./install.sh -silent
    - . /opt/firebird/SYSDBA.password
    - export ISC_PASSWORD
    - echo "alter user sysdba set password 'masterkey';" | /opt/firebird/bin/isql -u sysdba localhost:employee
    - cd ..
    - cp ci/firebird.conf /opt/firebird
    - g++ -o /opt/firebird/plugins/udr/libfbxci.so -shared -fPIC ci/udrs.cpp -I_tools/msgs/include
    - /etc/init.d/firebird restart
  parallel:
    matrix:
      - FB_VERSION: ${FB30_VERSION}
      - FB_VERSION: ${FB40_VERSION}
      - FB_VERSION: ${FB50_VERSION}

coverage:merge:
  stage: test
  tags: [docker, linux, x86_64]
  extends: .go-cache
  script:
    - mkdir merged
    - REPORTS=$(find reports/* -maxdepth 0|xargs|sed 's/ /,/g')
    - go tool covdata merge -i=${REPORTS} -o merged
    - go tool covdata textfmt -i=merged -o profile.txt
    - go tool cover -html profile.txt -o cover.html
    - go tool cover -func profile.txt
  dependencies: ["test:fb", "test:rdb"]
  needs: ["test:fb", "test:rdb"]
  artifacts:
    when: always
    paths:
      - cover.html
  coverage: '/total:\s+\(statements\)\s+\d+.\d+%/'

report:coverage:
  extends: .minio_template
  script:
    - mc alias set minio ${MINIO_SERVER} ${MINIO_USER} ${MINIO_PASSWORD}
    - mc rm -r --force minio/reports/coverage/fbx/${CI_COMMIT_REF_NAME}
    - mc cp cover.html minio/reports/coverage/fbx/${CI_COMMIT_REF_NAME}/index.html
    - echo Coverage ${MINIO_SERVER}reports/coverage/fbx/${CI_COMMIT_REF_NAME}/index.html
  dependencies: ["coverage:merge"]
  needs: ["coverage:merge"]
  only:
    - main

lint:
  tags: [docker, linux, x86_64]
  image: golangci/golangci-lint:$GOLANGCI_LINT_VERSION
  stage: test
  script:
    - golangci-lint run --issues-exit-code 0 --output.code-climate.path gl-code-quality-report.json --output.text.path stdout
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json

docs:gen:
  tags: [docker, linux, x86_64]
  stage: test
  extends: .go-cache
  script:
    - go run github.com/sourcey/sourcey/go/sourcey-godoc/cmd/sourcey-godoc@latest generate --out fbx
  artifacts:
    paths:
      - fbx

docs:deploy:
  extends: .minio_template
  script:
    - mc rm -r --force minio/docs/fbx
    - mc cp -r fbx minio/docs
    - echo Docs ${MINIO_SERVER}docs/fbx/index.html
  dependencies: ["docs:gen"]
  needs: ["docs:gen"]
  only:
    - main
